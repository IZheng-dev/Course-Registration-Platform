apiVersion: apps/v1
kind: Deployment
metadata:
  name: addcoursesservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: addcoursesservice
  template:
    metadata:
      labels:
        app: addcoursesservice
    spec:
      containers:
        - name: addcoursesservice
          image: izhengqh/coe692:addcoursesservice
          ports:
            - containerPort: 8080
          env:
            - name: ADDCOURSE_DB_HOST
              value: addcoursedb
            - name: ADDCOURSE_DB_PORT
              value: "3306"
            - name: ADDCOURSE_DB_NAME
              value: addCourse_LBS
            - name: ADDCOURSE_DB_USER
              value: root
            - name: ADDCOURSE_DB_PASSWORD
              value: student
            - name: kubeMQAddress
              value: kubemq-cluster-grpc.kubemq:50000
          imagePullPolicy: Always
---
