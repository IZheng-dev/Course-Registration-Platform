---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontendservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontendservice
  template:
    metadata:
      labels:
        app: frontendservice
    spec:
      containers:
        - name: frontendservice
          image: izhengqh/coe692:frontendservice
          ports:
            - containerPort: 8080
          env:
            - name: FRONTEND_DB_HOST
              value: frontenddb
            - name: FRONTEND_DB_PORT
              value: "3306"
            - name: FRONTEND_DB_NAME
              value: frontend_auth
            - name: FRONTEND_DB_USER
              value: root
            - name: FRONTEND_DB_PASSWORD
              value: student
            - name: ADDCOURSE_SERVICE_HOST
              value: addcoursesservice
            - name: ADDCOURSE_SERVICE_PORT
              value: "80"
            - name: REGCOURSE_SERVICE_HOST
              value: registercoursesservice
            - name: REGCOURSE_SERVICE_PORT
              value: "80"
          imagePullPolicy: Always
