apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frontenddb-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontenddb
spec:
  selector:
    matchLabels:
      app: frontenddb
  template:
    metadata:
      labels:
        app: frontenddb
    spec:
      containers:
        - name: frontenddb
          image: izhengqh/coe692:frontenddb
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "student"
          volumeMounts:
            - name: storage
              mountPath: /var/lib/mysql
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: frontenddb-pvc
---
